name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Running CI by hand (Actions → CI → Run workflow) also runs full tests on macOS.
  workflow_dispatch:
  workflow_call:
    inputs:
      run_windows:
        description: Run Windows build, test, and MSIX packaging job
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  detect-changes:
    name: Detect Changed Files
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      workflows_scripts: ${{ steps.filter.outputs.workflows_scripts }}
      changelog: ${{ steps.filter.outputs.changelog }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - '.cargo/**'
              - 'clippy.toml'
              - 'deny.toml'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - 'packaging/**'
            workflows_scripts:
              - '.github/**'
              - 'packaging/**'
              - '.pre-commit-config.yaml'
              - '.editorconfig'
              - '.yamllint.yml'
              - '_typos.toml'
              - 'Justfile'
              - '*.toml'
            changelog:
              - 'CHANGELOG.md'

  validate-changelog:
    name: Validate CHANGELOG.md (Keep a Changelog)
    runs-on: ubuntu-24.04
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.changelog == 'true'
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate CHANGELOG format
        uses: mindsers/changelog-reader-action@1faaf50aa09d5793d9a100819973df801febfb31 # v2.4.0
        with:
          path: ./CHANGELOG.md
          validation_level: warn

  secrets:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-workflows-and-scripts:
    name: Lint Infra, Scripts & Metadata
    runs-on: ubuntu-24.04
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.workflows_scripts == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OS validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint desktop-file-utils appstream
      - name: Install lint tools
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: taplo, typos
      - name: Register actionlint problem matcher
        run: echo "::add-matcher::.github/actionlint-matcher.json"
      - name: Run actionlint on GitHub Actions workflows
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo:ro" -w /repo rhysd/actionlint:1.7.12 -color
      - name: Run zizmor security audit on GitHub Actions
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          min-severity: medium
      - name: Lint YAML files
        run: yamllint -c .yamllint.yml .github/ .pre-commit-config.yaml .yamllint.yml
      - name: Lint TOML files
        run: taplo lint --no-schema Cargo.toml clippy.toml deny.toml rust-toolchain.toml rustfmt.toml _typos.toml
      - name: Check spelling (typos)
        run: typos
      - name: Run shellcheck on packaging scripts
        run: |
          shellcheck \
            packaging/linux/generate-cargo-sources.sh \
            packaging/macos/bundle.sh \
            packaging/macos/notarize.sh
      - name: Lint PowerShell scripts (PSScriptAnalyzer)
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -Repository PSGallery
          }
          Invoke-ScriptAnalyzer -Path packaging/windows -Recurse -Severity Error -EnableExit
      - name: Validate Linux desktop and AppStream metadata
        run: |
          desktop-file-validate packaging/linux/io.github.Vidhan31.Downmark.desktop
          appstreamcli validate --no-net --pedantic packaging/linux/io.github.Vidhan31.Downmark.metainfo.xml

  audit:
    name: Security & Policy Audit (cargo-deny, cargo-machete)
    runs-on: ubuntu-24.04
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.rust == 'true'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Check dependency advisories, bans, licenses, and sources (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check
      - name: Install cargo-machete
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-machete
      - name: Check for unused dependencies (cargo-machete)
        run: cargo machete

  check:
    name: Linux (fmt, clippy, features, nextest)
    runs-on: ubuntu-24.04
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.rust == 'true'
    timeout-minutes: 30
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: >-
        -C link-arg=-fuse-ld=mold
        -C link-arg=-Wl,-z,relro,-z,now
        -C link-arg=-Wl,-z,noexecstack
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system libraries and mold linker
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan1 mold clang
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - name: Install cargo-nextest
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo nextest run --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo check --locked --no-default-features --all-targets

  windows:
    name: Windows (clippy, build, nextest, MSIX)
    runs-on: windows-latest
    needs: [detect-changes]
    if: toJSON(inputs.run_windows) != 'false' && (github.event_name != 'pull_request' || needs.detect-changes.outputs.rust == 'true')
    timeout-minutes: 60
    env:
      # aws-lc-sys (TLS for remote images) needs NASM on x86_64 Windows
      # unless it may use its prebuilt objects.
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - name: Install cargo-nextest
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
      - run: cargo nextest run --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - if: github.event_name == 'workflow_dispatch'
        run: cargo build --locked --features gpui-kit/test-support
      - name: Test MSIX packaging
        if: github.event_name == 'workflow_dispatch'
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          & packaging/windows/build-msix.ps1 `
            -Version "0.0.0" `
            -SourceExe target/debug/downmark.exe `
            -OutputDir dist `
            -PackageName "Downmark.CI" `
            -Publisher "CN=Downmark-CI" `
            -PublisherDisplayName "Downmark CI" `
            -SignSelfSigned

  macos:
    # Runs clippy on main pushes; full build & tests on manual workflow_dispatch
    # to keep billed macOS runner minutes low.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: github.event_name == 'workflow_dispatch'
        run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - if: github.event_name == 'workflow_dispatch'
        run: cargo build --locked
