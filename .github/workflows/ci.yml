name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Running CI by hand (Actions → CI → Run workflow) also builds on macOS.
  workflow_dispatch:
  workflow_call:
    inputs:
      run_windows:
        description: Run Windows build, test, and MSIX packaging job
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  detect-changes:
    name: Detect Changed Files
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      workflows_scripts: ${{ steps.filter.outputs.workflows_scripts }}
      changelog: ${{ steps.filter.outputs.changelog }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - '.cargo/**'
              - 'clippy.toml'
              - 'deny.toml'
              - 'packaging/**'
            workflows_scripts:
              - '.github/**'
              - 'packaging/**'
              - '.pre-commit-config.yaml'
              - '.editorconfig'
            changelog:
              - 'CHANGELOG.md'

  validate-changelog:
    name: Validate CHANGELOG.md (Keep a Changelog)
    runs-on: ubuntu-24.04
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.changelog == 'true'
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate CHANGELOG format
        uses: mindsers/changelog-reader-action@1faaf50aa09d5793d9a100819973df801febfb31 # v2.4.0
        with:
          path: ./CHANGELOG.md
          validation_level: warn

  lint-workflows-and-scripts:
    name: Lint Workflows & Scripts (actionlint, zizmor, shellcheck)
    runs-on: ubuntu-24.04
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.workflows_scripts == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Register actionlint problem matcher
        run: echo "::add-matcher::.github/actionlint-matcher.json"
      - name: Run actionlint on GitHub Actions workflows
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo:ro" -w /repo rhysd/actionlint:1.7.12 -color
      - name: Run zizmor security audit on GitHub Actions
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          min-severity: medium
      - name: Run shellcheck on packaging scripts
        run: |
          shellcheck \
            packaging/linux/generate-cargo-sources.sh \
            packaging/macos/bundle.sh \
            packaging/macos/notarize.sh

  audit:
    name: Security & Policy Audit (cargo-deny, cargo-machete)
    runs-on: ubuntu-24.04
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.rust == 'true'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Check dependency advisories, bans, licenses, and sources (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check
      - name: Install cargo-machete
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-machete
      - name: Check for unused dependencies (cargo-machete)
        run: cargo machete

  check:
    name: Linux (check, clippy, test)
    runs-on: ubuntu-24.04
    needs: [detect-changes]
    if: github.event_name != 'pull_request' || needs.detect-changes.outputs.rust == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libvulkan1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  windows:
    name: Windows (build, test, MSIX)
    runs-on: windows-latest
    needs: [detect-changes]
    if: (inputs.run_windows == null || inputs.run_windows == true) && (github.event_name != 'pull_request' || needs.detect-changes.outputs.rust == 'true')
    timeout-minutes: 30
    env:
      # aws-lc-sys (TLS for remote images) needs NASM on x86_64 Windows
      # unless it may use its prebuilt objects.
      AWS_LC_SYS_PREBUILT_NASM: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked
      - run: cargo test --locked
      - name: Test MSIX packaging
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          & packaging/windows/build-msix.ps1 `
            -Version "0.0.0" `
            -SourceExe target/debug/downmark.exe `
            -OutputDir dist `
            -PackageName "Downmark.CI" `
            -Publisher "CN=Downmark-CI" `
            -PublisherDisplayName "Downmark CI" `
            -SignSelfSigned

  macos:
    # Only when CI is run by hand, as macOS runners are billed by the
    # minute. The repository variable MACOS_RUNNER picks another macOS
    # runner, such as GetMac's; GitHub's macOS 26 runner otherwise.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked
      - run: cargo test --locked
