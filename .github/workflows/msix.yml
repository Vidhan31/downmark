name: MSIX

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  msix:
    name: Build Windows MSIX
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      AWS_LC_SYS_PREBUILT_NASM: "1"
      HAS_SIGNING: ${{ vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' && vars.AZURE_SUBSCRIPTION_ID != '' && vars.ARTIFACT_SIGNING_ENDPOINT != '' && vars.ARTIFACT_SIGNING_ACCOUNT != '' && vars.ARTIFACT_SIGNING_PROFILE != '' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read version from Cargo.toml
        id: version
        run: |
          $version = (Get-Content Cargo.toml | Select-String -Pattern '^\s*version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if (-not $version) {
            throw "Could not determine version from Cargo.toml"
          }
          Write-Host "Resolved version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install cargo-auditable
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-auditable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msix-release
          cache-on-failure: true

      - name: Build release binary
        run: cargo auditable build --release --locked --target x86_64-pc-windows-msvc

      - name: Stage Downmark.exe
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/downmark.exe dist/Downmark.exe

      - name: Sign in to Azure
        if: env.HAS_SIGNING == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Downmark.exe
        if: env.HAS_SIGNING == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\Downmark.exe
          description: Downmark
          description-url: ${{ github.server_url }}/${{ github.repository }}
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-azure-cli-credential: false

      - name: Build MSIX package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MSIX_PACKAGE_NAME: ${{ vars.MSIX_PACKAGE_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $dist = (Resolve-Path dist).Path
          $signSelfSigned = ($env:HAS_SIGNING -ne 'true')

          & packaging/windows/build-msix.ps1 `
            -Version $env:VERSION `
            -SourceExe "$dist\Downmark.exe" `
            -OutputDir $dist `
            -SignSelfSigned:$signSelfSigned

      - name: Sign MSIX package
        if: env.HAS_SIGNING == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\Downmark-${{ steps.version.outputs.version }}-windows-x64.msix
          description: Downmark MSIX package
          description-url: ${{ github.server_url }}/${{ github.repository }}
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-azure-cli-credential: false

      - name: Upload MSIX Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Downmark-${{ steps.version.outputs.version }}-windows-msix
          path: |
            dist/*.msix
          if-no-files-found: error
