name: Flatpak

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'packaging/linux/**'
      - 'Cargo.*'
      - '.github/workflows/flatpak.yml'
  pull_request:
    paths:
      - 'packaging/linux/**'
      - 'Cargo.lock'
      - '.github/workflows/flatpak.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flatpak:
    name: "Build Flatpak Bundle"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: downmark-x86_64.flatpak
          manifest-path: packaging/linux/io.github.Vidhan31.Downmark.yaml
          cache: true
          upload-artifact: true
          artifact-name: downmark-x86_64-flatpak
