[env]
RUST_FONTCONFIG_DLOPEN = "1"

[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-C", "link-arg=-Wl,-z,relro,-z,now",
    "-C", "link-arg=-Wl,-z,noexecstack",
]

[target.x86_64-pc-windows-msvc]
rustflags = [
    "-C", "control-flow-guard=yes",
    "-C", "link-arg=/GUARD:CF",
    "-C", "link-arg=/CETCOMPAT",
]
