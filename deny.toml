# cargo-deny configuration for Downmark
# See: https://embarkstudios.github.io/cargo-deny/

[advisories]
# Only fail on unmaintained crates that downmark depends on directly; upstream
# GUI/Typst crates pull in several unmaintained transitive crates.
unmaintained = "workspace"
yanked = "warn"
# Transitive crates pinned by upstream dependencies (mitex-spec/tylax -> rkyv 0.7,
# citationberg/hayagriva/typst & wayland/xcb -> quick-xml 0.38) that downmark
# cannot upgrade directly without upstream releases.
ignore = [
  { id = "RUSTSEC-2026-0235", reason = "Transitive rkyv 0.7 via mitex-spec/tylax; no untrusted rkyv archives are parsed" },
  { id = "RUSTSEC-2026-0194", reason = "Transitive quick-xml 0.38 via upstream typst/wayland/xcb; no untrusted XML from citationberg" },
  { id = "RUSTSEC-2026-0195", reason = "Transitive quick-xml 0.38 NsReader via upstream deps; not exposed to untrusted XML streams" },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "NCSA",
  "OpenSSL",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
